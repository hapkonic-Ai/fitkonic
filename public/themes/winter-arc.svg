<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="waSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05080F"/>
      <stop offset="45%" stop-color="#0C192C"/>
      <stop offset="80%" stop-color="#152B44"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>
    <linearGradient id="waPeakLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2F1FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#7DD3FC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0D1926" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="waPeakShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E354F"/>
      <stop offset="100%" stop-color="#060A10"/>
    </linearGradient>
    <radialGradient id="waGlow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#07090C" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#waSky)"/>
  <rect width="1200" height="720" fill="url(#waGlow)"/>
  <!-- Distant icy jagged ridge -->
  <polygon points="0,460 140,280 260,360 410,165 560,310 690,140 840,295 990,175 1120,290 1200,240 1200,720 0,720" fill="url(#waPeakShadow)"/>
  <!-- Illuminated snow faces -->
  <polygon points="410,165 495,295 360,340" fill="url(#waPeakLight)"/>
  <polygon points="690,140 795,290 645,355" fill="url(#waPeakLight)"/>
  <polygon points="990,175 1075,285 935,330" fill="url(#waPeakLight)"/>
  <polygon points="140,280 215,355 105,390" fill="url(#waPeakLight)"/>
  <!-- Foreground dark alpine ridge + pine silhouettes -->
  <polygon points="0,520 220,345 390,445 600,275 815,435 1020,320 1200,450 1200,720 0,720" fill="#09111B"/>
  <polygon points="600,275 685,410 545,445" fill="url(#waPeakLight)" opacity="0.7"/>
  <!-- Cinematic winter mist -->
  <rect y="360" width="1200" height="360" fill="url(#waMist)"/>
  <!-- Subtle snow particles -->
  <g fill="#E0F2FE" opacity="0.45">
    <circle cx="180" cy="110" r="1.8"/><circle cx="340" cy="85" r="1.2"/><circle cx="520" cy="130" r="2.1"/>
    <circle cx="760" cy="95" r="1.5"/><circle cx="940" cy="140" r="1.8"/><circle cx="1080" cy="70" r="1.4"/>
    <circle cx="250" cy="220" r="1.5"/><circle cx="620" cy="210" r="1.3"/><circle cx="880" cy="230" r="2.0"/>
  </g>
</svg>
